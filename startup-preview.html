<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111416">
<title>小传说 · 启动动画预览</title>
<style>
*{box-sizing:border-box;letter-spacing:0}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111416;color:#f5e8cf;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #e6c885;outline-offset:5px}
[hidden]{display:none!important}
.scene{position:relative;width:100%;height:100%;min-height:280px;overflow:hidden;isolation:isolate;background:#111416}
.world{position:absolute;inset:-2%;background:url("assets/battlefield_2560x1440.png") center/cover no-repeat;will-change:transform,opacity}
.shade{position:absolute;inset:0;background:#080e15;opacity:.52}
.horizon{position:absolute;left:0;right:0;top:0;bottom:0;border-top:58px solid #0c1114;border-bottom:58px solid #0c1114;opacity:.9;pointer-events:none}
.topbar{position:absolute;top:21px;left:32px;right:32px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:10}
.edition{display:flex;align-items:center;gap:12px;color:#c0c2bd;font-size:11px}
.edition b{font-weight:500;color:#ead8b3}
.edition span{border-left:1px solid #6e736f;padding-left:12px}
.tools{display:flex;align-items:center;gap:8px}
.tool{display:grid;place-items:center;width:30px;height:30px;border:0;background:transparent;color:#d6d4c9;border-radius:3px;padding:4px}
.tool:hover{background:#ffffff15;color:#fff1ce}
.tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.skip{border:0;border-bottom:1px solid #a5977855;background:transparent;color:#c4c0b5;font-size:11px;padding:5px 0;margin-left:10px}
.identity{position:absolute;inset:58px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.crests{display:flex;align-items:center;justify-content:center;gap:30px;width:300px;height:170px;position:relative}
.crest{display:block;object-fit:contain;will-change:transform,opacity;filter:drop-shadow(0 8px 12px #0009)}
.crest.royal{width:80px;height:155px}
.crest.monster{width:112px;height:155px}
.crest-divider{height:76px;width:1px;background:#d4c39a;opacity:.36;transform:rotate(17deg)}
.wordmark{display:flex;gap:20px;margin:20px 0 0;font-family:"STZhongsong","Songti SC","SimSun",serif;font-size:80px;font-weight:600;line-height:1.2;color:#f3e4c7;text-shadow:0 3px 1px #131619,0 6px 24px #0008}
.wordmark span{display:block;will-change:transform,opacity}
.english{font-size:12px;margin:16px 0 0;color:#d6cfbd;font-weight:400}
.rule{display:flex;align-items:center;gap:15px;width:210px;margin-top:27px}
.rule:before,.rule:after{content:"";display:block;flex:1;height:1px;background:#d3bd90;opacity:.66}
.rule i{width:5px;height:5px;display:block;background:#ddc18a;transform:rotate(45deg)}
.tagline{font:15px/1.7 "STZhongsong","Songti SC",serif;color:#e0d6c2;margin:16px 0 0}
.crosslight{position:absolute;left:50%;top:50%;width:1px;height:300px;margin-top:-170px;background:#f0dcac;transform-origin:center;box-shadow:0 0 12px #ffe4a877;pointer-events:none}
.travel{position:absolute;left:50%;top:50%;width:122px;height:178px;margin:-100px 0 0 -61px;perspective:900px;pointer-events:none}
.travel img{width:100%;height:100%;object-fit:fill;display:block;border-radius:4px;box-shadow:0 18px 40px #0008;border:1px solid #dacda555}
.travel.monster img{border-color:#aaa0cf88}
.trail{position:absolute;top:50%;left:50%;height:1px;width:32%;background:#edd396;transform-origin:left;box-shadow:0 0 8px #e9c58744;pointer-events:none}
.trail.left{transform-origin:right;left:18%}
.trail.right{background:#bbaaf0;box-shadow:0 0 8px #b4a2ef44}
.foot{position:absolute;bottom:18px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:11px;color:#a3aaa6;z-index:10}
.phase{display:flex;align-items:center;gap:12px;color:#d7c8aa;min-width:0}
.phase-line{width:56px;height:2px;background:#59615f;overflow:hidden}
.phase-line i{display:block;height:100%;background:#e3c78c;transform:scaleX(0);transform-origin:left}
.phase-name{display:block;min-width:80px}
.preview-label{color:#a3aaa6;font-size:10px}
.seek{position:absolute;left:0;bottom:0;width:100%;height:3px;background:#20282b}
.seek i{display:block;background:#cbb581;height:100%;transform:scaleX(0);transform-origin:left}
.failed{position:absolute;left:50%;bottom:75px;transform:translateX(-50%);font-size:12px;color:#ffc2ad;z-index:12}
@media(max-width:700px){.wordmark{font-size:58px;gap:16px}.crests{height:135px;width:250px;gap:24px}.crest.royal{height:125px;width:65px}.crest.monster{height:125px;width:92px}.crest-divider{height:60px}.wordmark{margin-top:12px}.english{font-size:11px;margin-top:10px}.rule{margin-top:18px}.tagline{font-size:13px;margin-top:12px}.topbar,.foot{left:20px;right:20px}.edition span{display:none}}
@media(max-height:540px){.horizon{border-width:42px 0}.identity{inset:42px 0}.topbar{top:10px}.foot{bottom:11px}.crests{height:92px}.crest.royal{height:90px;width:48px}.crest.monster{height:90px;width:67px}.crest-divider{height:45px}.wordmark{font-size:48px;margin-top:10px;gap:14px}.english{margin-top:6px;font-size:10px}.rule{margin-top:13px}.tagline{margin-top:9px;font-size:12px}.travel{width:94px;height:137px;margin:-68px 0 0 -47px}}
</style>
</head>
<body>
<main class="scene" aria-label="小传说启动动画预览">
 <div class="world" aria-hidden="true"></div>
 <div class="shade" aria-hidden="true"></div>
 <div class="horizon" aria-hidden="true"></div>
 <div class="trail left" aria-hidden="true"></div><div class="trail right" aria-hidden="true"></div>
 <div class="travel royal" aria-hidden="true"><img src="assets/cardback_royal.png" alt=""></div>
 <div class="travel monster" aria-hidden="true"><img src="assets/cardback_monster.png" alt=""></div>
 <div class="crosslight" aria-hidden="true"></div>
 <div class="identity">
  <div class="crests" aria-hidden="true"><img class="crest royal" src="assets/emblem_royal_sword.png" alt=""><i class="crest-divider"></i><img class="crest monster" src="assets/emblem_monster_spiral.png" alt=""></div>
  <h1 class="wordmark" aria-label="小传说"><span>小</span><span>传</span><span>说</span></h1>
  <p class="english">THE LITTLE LEGEND</p>
  <div class="rule" aria-hidden="true"><i></i></div>
  <p class="tagline">王国与暗影之间，你的传说将启。</p>
 </div>
 <div class="topbar">
  <div class="edition"><b>小传说</b><span>开场序章</span></div>
  <div class="tools">
   <button class="tool" id="replay" title="重播" aria-label="重播"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
   <button class="tool" id="pause" title="暂停动画" aria-label="暂停动画"><svg viewBox="0 0 24 24"><path id="pause-path" d="M8 5v14M16 5v14"/></svg></button>
   <button class="skip" id="skip">跳过</button>
  </div>
 </div>
 <div class="foot"><div class="phase" role="status"><span class="phase-line" aria-hidden="true"><i></i></span><span class="phase-name">序幕</span></div><span class="preview-label">启动动画预览</span></div>
 <div class="seek" aria-hidden="true"><i></i></div>
 <p class="failed" hidden>部分素材未能加载，请保持本文件与 assets 文件夹在同一目录。</p>
</main>
<script>
const duration=6400,animations=[];
const $=selector=>document.querySelector(selector);
let position=0,origin=0,playing=false,frame=0,runId=0;
function motion(selector,keyframes,delay,time,easing='cubic-bezier(.22,.7,.2,1)'){
 document.querySelectorAll(selector).forEach(el=>{
  const animation=el.animate(keyframes,{duration:time,delay,fill:'both',easing});
  animation.pause();animations.push(animation);
 });
}
motion('.world',[{opacity:0,transform:'scale(1.1)'},{opacity:1,transform:'scale(1)'}],0,4200);
motion('.shade',[{opacity:.95},{opacity:.55}],0,2600);
motion('.travel.royal',[{opacity:0,transform:'translateX(-420px) translateY(40px) rotate(-28deg)'},{opacity:1,offset:.35,transform:'translateX(-170px) translateY(-8px) rotate(-13deg)'},{opacity:1,offset:.7,transform:'translateX(-130px) translateY(0) rotate(-8deg)'},{opacity:0,transform:'translateX(-70px) translateY(-30px) scale(.8) rotate(0deg)'}],250,1950);
motion('.travel.monster',[{opacity:0,transform:'translateX(420px) translateY(40px) rotate(28deg)'},{opacity:1,offset:.35,transform:'translateX(170px) translateY(-8px) rotate(13deg)'},{opacity:1,offset:.7,transform:'translateX(130px) translateY(0) rotate(8deg)'},{opacity:0,transform:'translateX(70px) translateY(-30px) scale(.8) rotate(0deg)'}],450,1750);
motion('.trail.left',[{opacity:0,transform:'scaleX(0)'},{opacity:.8,offset:.55,transform:'scaleX(1)'},{opacity:0,transform:'scaleX(1)'}],1100,1150);
motion('.trail.right',[{opacity:0,transform:'scaleX(0)'},{opacity:.8,offset:.55,transform:'scaleX(1)'},{opacity:0,transform:'scaleX(1)'}],1200,1050);
motion('.crosslight',[{opacity:0,transform:'scaleY(0)'},{opacity:.8,offset:.4,transform:'scaleY(1)'},{opacity:0,transform:'scaleY(1.1)'}],1800,700);
motion('.crest.royal',[{opacity:0,transform:'translate(-38px,12px) scale(.88)'},{opacity:1,transform:'translate(0,0) scale(1)'}],1950,1000);
motion('.crest.monster',[{opacity:0,transform:'translate(38px,12px) rotate(-18deg) scale(.88)'},{opacity:1,transform:'translate(0,0) rotate(0deg) scale(1)'}],2050,1100);
motion('.crest-divider',[{opacity:0,transform:'rotate(17deg) scaleY(0)'},{opacity:.36,transform:'rotate(17deg) scaleY(1)'}],2600,700);
document.querySelectorAll('.wordmark span').forEach((el,index)=>{
 const animation=el.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'translateY(0)'}],{delay:2600+index*160,duration:1000,fill:'both',easing:'cubic-bezier(.22,.7,.2,1)'});
 animation.pause();animations.push(animation);
});
motion('.english',[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],3300,800);
motion('.rule',[{opacity:0,transform:'scaleX(.2)'},{opacity:1,transform:'scaleX(1)'}],3550,900);
motion('.tagline',[{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],4000,900);
motion('.phase-line i',[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],0,duration,'linear');
motion('.seek i',[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],0,duration,'linear');
function paint(time){
 position=Math.max(0,Math.min(duration,time));
 animations.forEach(animation=>animation.currentTime=position);
 $('.phase-name').textContent=position<1800?'王国苏醒':position<3000?'暗影回应':position<4900?'传说将启':'请入席';
 $('#skip').hidden=position===duration;
}
function pauseLabel(){
 $('#pause').title=playing?'暂停动画':'播放动画';$('#pause').setAttribute('aria-label',$('#pause').title);
 $('#pause-path').setAttribute('d',playing?'M8 5v14M16 5v14':'M8 5l11 7-11 7z');
}
function tick(now){
 if(!playing)return;
 paint(now-origin);
 if(position>=duration){playing=false;pauseLabel();return;}
 frame=requestAnimationFrame(tick);
}
function play(){if(position>=duration)paint(0);playing=true;origin=performance.now()-position;pauseLabel();cancelAnimationFrame(frame);frame=requestAnimationFrame(tick);}
function pause(){playing=false;cancelAnimationFrame(frame);pauseLabel();}
function replay(){pause();paint(0);play();}
$('#replay').onclick=replay;
$('#pause').onclick=()=>playing?pause():play();
$('#skip').onclick=()=>{pause();paint(duration);};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause();});
async function prepare(){
 const current=++runId;paint(0);
 await Promise.all([...document.images].map(img=>img.decode().catch(()=>{$('.failed').hidden=false;})));
 const background=new Image();background.src='assets/battlefield_2560x1440.png';
 await background.decode().catch(()=>{$('.failed').hidden=false;});
 if(current!==runId)return;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){paint(duration);pauseLabel();}
 else play();
}
prepare();
</script>
</body>
</html>
